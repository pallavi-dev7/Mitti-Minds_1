<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Mitti Minds</title>

<div class="toast" id="toast" role="status"></div>
<div class="spl" id="spl"><div class="lg">🌱</div><h1 style="font-size:32px">Mitti <span>Minds</span></h1><div class="mini">Choose language · భాష ఎంచుకోండి · भाषा चुनें</div><button class="spb" data-sp="te">తెలుగు</button><button class="spb" data-sp="hi">हिन्दी</button><button class="spb" data-sp="en">English</button></div>
<div id="app" role="main">

<div class="samples" id="samples"></div>
<div class="row"><button class="btn" id="cam">📷 <span id="t_scan"></span></button><button class="btn o" id="up">🖼 <span id="t_up"></span></button></div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<div id="res" aria-live="polite" style="margin-top:12px"></div>
</section>

<section class="pg" id="p1"><div id="alerts"></div></section>

<section class="pg" id="p2">
<div class="stat"><div><b id="s1">0</b><small id="l1"></small></div><div><b id="s2">0</b><small id="l2"></small></div><div><b id="s3">0</b><small id="l3"></small></div></div>

<g id="dots"></g><circle cx="150" cy="125" r="5" fill="#fff"/><text x="158" y="128" fill="#fff" font-size="9" id="you"></text></svg></div>
<button class="btn" id="rep" style="margin-top:10px">📍 <span id="t_rep"></span></button>
<div class="note" id="n_rad"></div></section>

<section class="pg" id="p3"><div class="tabs" id="lf"></div><input id="q"><div class="tabs" id="sf"></div><div id="schemes"></div><div class="note" id="n_sch"></div></section>
</div>
<nav id="nav"></nav>

<div class="ask" id="ask"><div class="row2" style="margin-bottom:10px"><b id="askt" style="flex:1"></b><button id="askx" aria-label="Close" style="background:#ffffff18;color:#fff">✕</button></div><div class="card" id="ans" aria-live="polite" style="font-size:14px;min-height:64px"></div><div class="row2"><input id="aq"><button id="mic" aria-label="Speak">🎤</button><button id="go" aria-label="Send">➤</button></div></div>
